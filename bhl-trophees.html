<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BHL | Trophées et honneurs</title>
<style>
:root{--bg:#eef0f2;--panel:#fff;--line:#dfe2e6;--text:#191919;--muted:#626b75;--red:#cc0000;--team-color:#cc0000}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:0 22px}.top{position:sticky;top:0;z-index:5;background:#cc0000;border-bottom:1px solid #a80000}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px;color:#fff;font-weight:900;letter-spacing:.08em}.league-logo{width:48px;height:48px;object-fit:contain}.navlinks{display:flex;gap:20px;color:#fff;font-size:13px;font-weight:700}.menu-toggle{display:none;background:#fff;color:#cc0000;border:0;border-radius:8px;padding:10px 13px;font-weight:800}.hero{padding:38px 0 24px}.kicker{color:var(--red);font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.hero h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.04em;line-height:1.05;margin:9px 0}.hero p{color:var(--muted);max-width:680px;margin:12px 0 0}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 230px;gap:12px;margin:12px 0 22px}input,select{background:#fff;color:#191919;border:1px solid #d4d8dd;border-radius:10px;padding:13px 14px;font:inherit;width:100%}.status{padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--muted);margin:15px 0}.status.ok{color:#24734b}.status.error{color:#b00020}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:18px 0 30px}.trophy-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 2px 10px #00000008;cursor:pointer;transition:.18s;min-width:0}.trophy-card:hover{transform:translateY(-2px);border-color:#cc0000;box-shadow:0 5px 18px #00000012}.trophy-art{height:132px;border-radius:11px;background:linear-gradient(145deg,#f1f2f4,#fff);display:grid;place-items:center;margin-bottom:14px;border:1px solid #eceef0}.trophy-art img{max-width:85%;max-height:112px;object-fit:contain}.category-heading{grid-column:1/-1;margin:18px 0 0;padding:12px 15px;background:#cc0000;color:#fff;border-radius:10px;font-weight:900;letter-spacing:.05em}.detail-banner img{width:76px;height:76px;object-fit:contain}.medal-note{font-size:12px;color:var(--muted);margin-top:3px}.trophy-symbol{font-size:60px;filter:grayscale(.15)}.trophy-card h2{font-size:18px;margin:0 0 6px}.muted{color:var(--muted);font-size:13px}.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid #eceef0}.pill{display:inline-block;border:1px solid #dfe2e6;background:#f1f2f4;color:#343a40;padding:4px 9px;border-radius:99px;font-size:11px;font-weight:800}.detail{display:none;margin:18px 0 34px}.detail.show{display:block}.back{border:0;background:#cc0000;color:#fff;padding:10px 14px;border-radius:8px;font-weight:800;cursor:pointer;margin:0 0 15px}.detail-banner{background:#fff;border:1px solid var(--line);border-left:5px solid #cc0000;border-radius:15px;padding:22px;display:flex;align-items:center;gap:18px;box-shadow:0 2px 10px #00000008}.detail-banner .trophy-symbol{font-size:46px}.detail-banner h2{margin:0;font-size:clamp(22px,4vw,32px)}.season-block{background:#fff;border:1px solid var(--line);border-radius:13px;margin:14px 0;overflow:hidden;box-shadow:0 2px 10px #00000006}.season-title{background:#cc0000;color:#fff;padding:11px 15px;font-weight:900;letter-spacing:.04em}.award-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid #eceef0}.award-row:last-child{border-bottom:0}.person-team{display:flex;align-items:center;gap:12px;min-width:0}.teamlogo{width:43px;height:43px;object-fit:contain;flex:0 0 auto}.person{font-weight:850}.teamname{font-size:12px;color:var(--muted)}.label-winner{background:#fff2d6;color:#805400;border:1px solid #f0d79b}.label-finalist{background:#edf1f5;color:#4b5968;border:1px solid #d6dce3}.empty{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;color:var(--muted)}.footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:12px;margin-top:30px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.navlinks{display:none}.menu-toggle{display:block}.nav{height:auto;min-height:66px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}.navlinks.is-open{display:flex;flex:0 0 100%;flex-direction:column;gap:0;background:#fff;border-radius:10px;padding:6px}.navlinks.is-open a{color:#191919;padding:12px;border-bottom:1px solid #eee}.navlinks.is-open a:last-child{border:0}.toolbar{grid-template-columns:1fr}}
@media(max-width:540px){.wrap{padding:0 13px}.grid{grid-template-columns:1fr;gap:11px}.trophy-card{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:12px}.trophy-art{height:92px;margin:0;grid-row:span 2}.trophy-symbol{font-size:43px}.trophy-art img{max-height:78px}.trophy-card h2{font-size:16px}.card-foot{margin-top:5px;padding-top:7px}.detail-banner{padding:15px}.award-row{grid-template-columns:1fr;gap:7px}.award-row .pill{justify-self:start}.teamlogo{width:38px;height:38px}}
</style></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="index.html"><img class="league-logo" src="logos/BHLlogo.png" alt="BHL"><span>BHL / TROPHÉES</span></a><button class="menu-toggle" id="menuToggle">☰ MENU</button><nav class="navlinks" id="navlinks"><a href="index.html">Actualités</a><a href="bhl-accueil-forbes-connecte.html">FORBES</a><a href="bhl-equipes-connectees.html">Équipes</a><a href="bhl-trophees.html">Trophées</a></nav></div></header>
<main class="wrap"><section class="hero"><div class="kicker">La ligue · Distinctions et histoire</div><h1>TROPHÉES ET <span style="color:#cc0000">HONNEURS.</span></h1><p>Découvrez les trophées de la BHL, leurs récipiendaires et les équipes finalistes au fil des saisons.</p></section>
<div class="toolbar"><input id="search" type="search" placeholder="Rechercher un trophée…"><select id="category"><option value="">Toutes les distinctions</option></select></div><div id="status" class="status">Connexion aux données des trophées…</div><section id="gallery" class="grid"></section><section id="detail" class="detail"></section><footer class="footer">BHL · Béliveau Hockey League · Palmarès officiel</footer></main>
<script>
const API='https://script.google.com/macros/s/AKfycbyhz6nFb1gR_JiNF6VLl_8q-nUjo7OkbB9hNqSzZVdc4n_hZhUKQ3aTu3YqGTJCrjARiQ/exec';
const LOGOS={'DETROIT COUGARS':'detroit-cougars.png','COUGARS DE DETROIT':'detroit-cougars.png','TOE DRAGO':'toegrago.png','TOEGRAGO':'toegrago.png','ANAHEIM MIGHTY DUCKS':'anaheim-mightyducks.png','ATLANTA THRASHERS':'atlanta-thrashers.png','BOSTON BRUINS':'boston-bruins.png','CLEVELAND BARONS':'cleveland-barons.png','CALIFORNIA GOLDEN SEALS':'california-goldenseals.png','CHICAGO BLACKHAWKS':'chicago-blackhawks.png','COLORADO AVALANCHE':'colorado-avalanche.png','DETROIT RED WINGS':'detroit-redwings.png','FLORIDA PANTHERS':'florida-panthers.png','HARTFORD WHALERS':'hartford-whalers.png','MINNESOTA NORTH STARS':'minnesota-northstars.png','MONTREAL CANADIENS':'montreal-canadiens.png','MONTREAL MAROONS':'montreal-maroons.png','NASHVILLE PREDATORS':'nashville-predators.png','NEW YORK RANGERS':'newyork-rangers.png','OTTAWA SENATORS':'ottawa-senators.png','EDMONTON OILERS':'edmonton-oilers.png','QUEBEC NORDIQUES':'quebec-nordiques.png','TORONTO MAPLE LEAFS':'toronto-mapleleafs.png','VEGAS GOLDEN KNIGHTS':'vegas-goldenknights.png','WINNIPEG JETS':'winnipeg-jets.png'};
const TROPHY_IMAGES={
 'COUPE BELIVEAU':'coupe-beliveau.png','FINALE BHL':'finale-bhl.png','SCOTTY BOWMAN':'scotty-bowman.png','SAM POLLOCK':'sam-pollock.png','YVAN COURNOYER':'yvan-cournoyer.png','SERGE SAVARD':'serge-savard.png','ANDREI MARKOV':'andrei-markov.png','SAKU KOIVU':'saku-koivu.png','CLAUDE LEMIEUX':'claude-lemieux.png','HOWIE MORENZ':'howie-morenz.png','PATRICK ROY':'patrick-roy.png','GUY LAFLEUR':'guy-lafleur.png','COUPE DU MONDE':'coupe-du-monde.png','CONFRONTATION 4 NATIONS':'confrontation-4-nations.png',
 'CAREY PRICE':'carey-price.png','DOUG HARVEY':'doug-harvey.png','EMILE BUTCH BOUCHARD':'emile-butch-bouchard.png','GEORGE VEZINA':'george-vezina.png','GUY CARBONNEAU':'guy-carbonneau.png','HENRI RICHARD':'henri-richard.png','JACQUES DEMERS':'jacques-demers.png','JACQUES PLANTE':'jacques-plante.png','JOHNNY GAUDREAU':'johnny-gaudreau.png','JOSE THEODORE':'jose-theodore.png','KEN DRYDEN':'ken-dryden.png','LARRY ROBINSON':'larry-robinson.png','MAURICE RICHARD':'maurice-richard.png','STEPHANE RICHER':'stephane-richer.png','YANIC PERREAULT':'yanic-perreault.png'
};
const MAJOR=['COUPE BELIVEAU','FINALE BHL','SCOTTY BOWMAN','SAM POLLOCK','YVAN COURNOYER','SERGE SAVARD','ANDREI MARKOV','SAKU KOIVU','CLAUDE LEMIEUX','HOWIE MORENZ','PATRICK ROY','GUY LAFLEUR'];
function medalGroup(name){
 const n=norm(name);
 if(n.includes('J O')||n.includes('JEUX OLYMPIQUES'))return 'JEUX OLYMPIQUES';
 if(n.includes('COUPE DU MONDE'))return 'COUPE DU MONDE';
 if(n.includes('4 NATIONS')||n.includes('CONFRONTATION'))return 'CONFRONTATION 4 NATIONS';
 if(n.includes('WJC'))return 'CHAMPIONNAT MONDIAL JUNIOR';
 return '';
}
function medalType(name){const n=norm(name);if(n.startsWith('OR ')||n.includes(' OR '))return 'OR';if(n.startsWith('ARGENT ')||n.includes(' ARGENT'))return 'ARGENT';if(n.startsWith('BRONZE ')||n.includes(' BRONZE'))return 'BRONZE';return ''}
function categoryFor(name){const n=norm(name);if(medalGroup(name))return 'INTERNATIONAL';if(MAJOR.includes(n))return 'MAJOR';return 'SECONDARY'}
function trophyImage(name){const n=norm(name);let file=TROPHY_IMAGES[n];if(!file){const m=medalGroup(name);if(m==='JEUX OLYMPIQUES')file='or-j-o-masculin.png';else if(m==='CHAMPIONNAT MONDIAL JUNIOR')file='or-wjc.png';else file='coupe-du-monde.png'}return file?`<img src="trophies/${file}" alt="${esc(name)}" onerror="this.style.display='none'">`:''}
const $=s=>document.querySelector(s), norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim(), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(s,kind=''){const e=$('#status');e.textContent=s;e.className='status '+kind}
function jsonp(sheet){return new Promise((resolve,reject)=>{const cb='bhlTrophy_'+Date.now();const sc=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(Error('Délai de connexion dépassé'))},20000);function cleanup(){clearTimeout(timer);delete window[cb];sc.remove()}window[cb]=d=>{cleanup();resolve(d)};sc.onerror=()=>{cleanup();reject(Error('Impossible de joindre Google Sheets'))};sc.src=API+'?sheet='+encodeURIComponent(sheet)+'&callback='+cb;document.body.appendChild(sc)})}
function parseRows(rows){const records=[];for(const r of rows.slice(1)){if(!Array.isArray(r))continue;const cells=r.map(x=>String(x??'').trim());if(!cells.some(Boolean))continue;
 // Les anciennes lignes et les lignes de finalistes peuvent avoir des colonnes décalées : on teste les deux structures présentes dans TROPHYLIST.
 let trophy=cells[4]||cells[2]||cells[3]||'';let season=cells[5]||cells[3]||cells[4]||'';let team=cells[8]||cells[6]||'';let person=cells[9]||cells[7]||'';let code=cells[12]||cells[10]||'';let stats=cells[10]||cells[8]||'';
 if(!/\d{4}\s*[-–]\s*\d{2,4}/.test(season)){const si=cells.findIndex(x=>/^\d{4}\s*[-–]\s*\d{2,4}$/.test(x));if(si>=0)season=cells[si]}
 const finalist=cells.some(x=>norm(x).startsWith('FINALISTE'))||norm(trophy).startsWith('FINALISTE');
 const medal=medalType(trophy)||medalType(cells.join(' '));const international=medalGroup(trophy)||medalGroup(cells.join(' '));
 if(international)trophy=international;
 if(finalist){const mark=cells.find(x=>norm(x).startsWith('FINALISTE'));if(mark)trophy=mark.replace(/^FINALISTE\s*[:\-–]?\s*/i,'').trim()||trophy}
 if(!trophy||!season||!person||!team)continue;
 if(norm(trophy)==='FINAL BHL')trophy='Coupe BHL';
 records.push({trophy,season,team,person,code,stats,finalist:finalist||medal==='ARGENT'||medal==='BRONZE',medal});}
 return records}
function logo(team,code){let file=LOGOS[norm(team)];if(!file){const c=norm(code);const map={ANA:'anaheim-mightyducks.png',ATL:'atlanta-thrashers.png',BOS:'boston-bruins.png',COL:'colorado-avalanche.png',DET:'detroit-redwings.png',FLA:'florida-panthers.png',HAR:'hartford-whalers.png',MIN:'minnesota-northstars.png',MTL:'montreal-canadiens.png',NSH:'nashville-predators.png',NYR:'newyork-rangers.png',OTT:'ottawa-senators.png',QUE:'quebec-nordiques.png',TOR:'toronto-mapleleafs.png'};file=map[c]}return file?`<img class="teamlogo" src="logos/${file}" alt="" onerror="this.style.display='none'">`:''}
let awards=[];function buildAwards(records){const map=new Map();records.forEach(r=>{const key=norm(r.trophy);if(!map.has(key))map.set(key,{name:r.trophy,records:[],category:categoryFor(r.trophy)});map.get(key).records.push(r)});return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'fr'))}
function render(){
 const q=norm($('#search').value),cat=$('#category').value;
 const filtered=awards.filter(a=>(!cat||a.category===cat)&&(!q||norm(a.name).includes(q)));
 const groups=[['MAJOR','HONNEURS MAJEURS'],['SECONDARY','HONNEURS SECONDAIRES'],['INTERNATIONAL','HONNEURS INTERNATIONAUX']];
 $('#gallery').innerHTML=groups.map(([key,label])=>{
  const items=filtered.filter(a=>a.category===key);
  if(!items.length)return '';
  return `<div class="category-heading">${label}</div>`+items.map(a=>`<article class="trophy-card" data-name="${esc(a.name)}" tabindex="0" role="button"><div class="trophy-art">${trophyImage(a.name)||'<span class="trophy-symbol">🏆</span>'}</div><div><h2>${esc(a.name)}</h2><div class="muted">${a.records.length} résultat(s) · ${new Set(a.records.map(r=>r.season)).size} saison(s)</div><div class="card-foot"><span class="pill">Voir l’historique</span><span class="muted">↗</span></div></div></article>`).join('');
 }).join('')||'<div class="empty">Aucun trophée ne correspond à cette recherche.</div>';
 document.querySelectorAll('.trophy-card').forEach(c=>{const open=()=>showDetail(c.dataset.name);c.addEventListener('click',open);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});
}
function showDetail(name){const a=awards.find(x=>x.name===name);if(!a)return;const bySeason=new Map();a.records.forEach(r=>{if(!bySeason.has(r.season))bySeason.set(r.season,[]);bySeason.get(r.season).push(r)});const seasons=[...bySeason.keys()].sort((x,y)=>y.localeCompare(x));$('#gallery').style.display='none';$('#toolbar')?.style.setProperty('display','none');$('.toolbar').style.display='none';$('#detail').classList.add('show');$('#detail').innerHTML=`<button class="back" id="back">← Retour aux trophées</button><div class="detail-banner">${trophyImage(a.name)||'<span class="trophy-symbol">🏆</span>'}<div><div class="kicker">Palmarès BHL</div><h2>${esc(a.name)}</h2><div class="muted">${a.records.length} récipiendaire(s) et finaliste(s) répertorié(s)</div></div></div>${seasons.map(s=>`<section class="season-block"><div class="season-title">SAISON ${esc(s)}</div>${bySeason.get(s).map(r=>`<div class="award-row"><div class="person-team">${logo(r.team,r.code)}<div><div class="person">${esc(r.person)}</div><div class="teamname">${esc(r.team)}</div>${r.stats?`<div class="teamname">${esc(r.stats)}</div>`:'' }${r.medal?`<div class="medal-note">Médaille ${r.medal.toLowerCase()}</div>`:''}</div></div><span class="pill ${r.finalist?'label-finalist':'label-winner'}">${r.medal==='OR'?'MÉDAILLE D’OR · GAGNANT':r.medal==='ARGENT'?'MÉDAILLE D’ARGENT · FINALISTE':r.medal==='BRONZE'?'MÉDAILLE DE BRONZE · FINALISTE':r.finalist?'FINALISTE':'GAGNANT'}</span></div>`).join('')}</section>`).join('')}`;$('#back').onclick=()=>{$('#detail').classList.remove('show');$('#gallery').style.display='grid';$('.toolbar').style.display='grid';$('#detail').innerHTML='';window.scrollTo({top:0,behavior:'smooth'})};window.scrollTo({top:0,behavior:'smooth'})}
$('#search').addEventListener('input',render);$('#category').addEventListener('change',render);$('#menuToggle').onclick=()=>$('#navlinks').classList.toggle('is-open');
(async()=>{try{setStatus('Chargement des trophées depuis Google Sheets…');const d=await jsonp('TROPHYLIST');if(!d||!d.ok||!d.data||!Array.isArray(d.data.rows))throw Error(d?.error||'Format de données inattendu');const records=parseRows(d.data.rows);if(!records.length)throw Error('Les données sont reçues, mais aucune ligne n’a été reconnue. Vérifier la structure des colonnes TROPHYLIST.');awards=buildAwards(records);$('#category').innerHTML='<option value="">Toutes les catégories</option><option value="MAJOR">Honneurs majeurs</option><option value="SECONDARY">Honneurs secondaires</option><option value="INTERNATIONAL">Honneurs internationaux</option>';setStatus(`${awards.length} trophée(s) chargés · ${records.length} entrées au palmarès.`,'ok');render()}catch(e){setStatus('Erreur : '+e.message,'error');$('#gallery').innerHTML='<div class="empty">Les trophées ne peuvent pas être affichés pour le moment.</div>'}})();
</script></body></html>
