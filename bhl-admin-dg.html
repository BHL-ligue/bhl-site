<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration DG | BHL</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef0f2;color:#191919;font:15px Arial,sans-serif}.top{background:#cc0000;color:white;padding:18px 22px}.top a{color:white;text-decoration:none;font-weight:bold}.wrap{max-width:1100px;margin:28px auto;padding:0 14px}h1{font-size:36px}.card{background:white;border:1px solid #dfe2e6;border-radius:13px;padding:20px;margin:16px 0}.btn{background:#cc0000;color:white;border:0;border-radius:7px;padding:9px 13px;font-weight:bold;cursor:pointer}.secondary{background:#50565d}.reject{background:#666}.status{padding:12px;background:#f1f2f4;border-radius:8px;white-space:pre-wrap}.error{background:#fff0f0;color:#a00}.ok{background:#eef8f0;color:#176b32}.hidden{display:none!important}.field{display:block;font-weight:bold;font-size:13px;margin:12px 0}.field input{display:block;width:100%;padding:11px;border:1px solid #ccd0d5;border-radius:8px;margin-top:5px}table{border-collapse:collapse;width:100%;min-width:680px}th,td{text-align:left;padding:10px;border-bottom:1px solid #dfe2e6}th{background:#f1f2f4;font-size:12px}.scroll{overflow:auto}.actions{display:flex;gap:7px;flex-wrap:wrap}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
</style><link rel="stylesheet" href="bhl-navigation.css?v=1"></head><body><div id="bhl-global-nav"></div><main class="wrap"><div style="color:#cc0000;font-weight:bold;letter-spacing:.12em">BÉLIVEAU HOCKEY LEAGUE</div><h1>Administration de l’Espace DG</h1><p>Approuve les demandes et attribue une organisation à chaque directeur général.</p><div id="status" class="status">Vérification de la session…</div><section id="login" class="card hidden"><h2>Connexion administrateur</h2><form id="loginForm"><label class="field">Courriel<input name="email" type="email" required></label><label class="field">Mot de passe<input name="password" type="password" required></label><button class="btn">Se connecter</button></form></section><section id="app" class="hidden"><div class="row"><h2>Demandes d'accès</h2><button id="logout" class="btn secondary">Déconnexion</button></div><div class="card"><div id="requests" class="scroll">Chargement…</div></div><div class="card"><h2>Comptes DG actifs</h2><div id="dgs" class="scroll">Chargement…</div></div><div class="card"><h2>Leadership des organisations</h2><div id="leadership" class="scroll">Chargement…</div></div></section></main>
<script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from'./bhl-supabase.js';const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t,c=''){$('#status').textContent=t;$('#status').className='status '+c}
async function boot(){const{data:{session}}=await db.auth.getSession();if(!session){$('#login').classList.remove('hidden');$('#app').classList.add('hidden');msg('Connecte-toi avec ton compte administrateur.');return}const{data:p,error}=await db.from('bhl_profiles').select('role').eq('user_id',session.user.id).maybeSingle();if(error||p?.role!=='admin'){msg('Accès réservé à l’administrateur BHL.','error');await db.auth.signOut();$('#login').classList.remove('hidden');return}$('#login').classList.add('hidden');$('#app').classList.remove('hidden');msg('Session administrateur vérifiée.','ok');await refresh()}
async function refresh(){await Promise.all([requests(),dgs(),leaders()])}
async function requests(){const{data,error}=await db.from('bhl_account_requests').select('request_id,user_id,email,full_name,requested_team_id,created_at').eq('status','pending').order('created_at');if(error){$('#requests').textContent=error.message;return}const{data:ts}=await db.from('bhl_teams').select('team_id,team_name');const names=Object.fromEntries((ts||[]).map(t=>[t.team_id,t.team_name]));if(!data?.length){$('#requests').textContent='Aucune demande en attente.';return}$('#requests').innerHTML='<table><thead><tr><th>Nom</th><th>Courriel</th><th>Organisation</th><th>Date</th><th>Action</th></tr></thead><tbody>'+data.map(r=>'<tr><td>'+esc(r.full_name)+'</td><td>'+esc(r.email)+'</td><td>'+esc(names[r.requested_team_id]||r.requested_team_id)+'</td><td>'+new Date(r.created_at).toLocaleDateString('fr-CA')+'</td><td><div class="actions"><button class="btn" data-yes="'+esc(r.request_id)+'" data-user="'+esc(r.user_id)+'" data-team="'+esc(r.requested_team_id)+'">Approuver</button><button class="btn reject" data-no="'+esc(r.request_id)+'">Refuser</button></div></td></tr>').join('')+'</tbody></table>';document.querySelectorAll('[data-yes]').forEach(b=>b.onclick=()=>approve(b.dataset.yes,b.dataset.user,b.dataset.team));document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>reject(b.dataset.no))}
async function approve(id,user,team){if(!confirm('Approuver ce DG pour cette organisation?'))return;const{error}=await db.from('bhl_profiles').update({role:'dg',team_id:team}).eq('user_id',user);if(error){msg(error.message,'error');return}const{data:{user:me}}=await db.auth.getUser();const{error:e}=await db.from('bhl_account_requests').update({status:'approved',reviewed_at:new Date().toISOString(),reviewed_by:me.email}).eq('request_id',id);if(e){msg('Profil attribué, demande non mise à jour : '+e.message,'error');return}msg('Compte DG approuvé.','ok');await refresh()}
async function reject(id){const note=prompt('Motif du refus (facultatif) :')||null;const{data:{user:me}}=await db.auth.getUser();const{error}=await db.from('bhl_account_requests').update({status:'rejected',admin_note:note,reviewed_at:new Date().toISOString(),reviewed_by:me.email}).eq('request_id',id);if(error){msg(error.message,'error');return}msg('Demande refusée.','ok');await requests()}
async function dgs(){const{data,error}=await db.from('bhl_profiles').select('email,full_name,team_id').eq('role','dg').order('email');if(error){$('#dgs').textContent=error.message;return}const{data:ts}=await db.from('bhl_teams').select('team_id,team_name');const names=Object.fromEntries((ts||[]).map(t=>[t.team_id,t.team_name]));$('#dgs').innerHTML=!data?.length?'Aucun DG actif.':'<table><thead><tr><th>DG</th><th>Courriel</th><th>Organisation</th></tr></thead><tbody>'+data.map(p=>'<tr><td>'+esc(p.full_name||'—')+'</td><td>'+esc(p.email)+'</td><td>'+esc(names[p.team_id]||p.team_id)+'</td></tr>').join('')+'</tbody></table>'}
async function leaders(){const{data,error}=await db.from('bhl_team_leadership').select('team_id,captain,assistant_1,assistant_2,assistant_3,updated_at').order('team_id');if(error){$('#leadership').textContent=error.message;return}const{data:ts}=await db.from('bhl_teams').select('team_id,team_name');const names=Object.fromEntries((ts||[]).map(t=>[t.team_id,t.team_name]));$('#leadership').innerHTML='<table><thead><tr><th>Organisation</th><th>Capitaine</th><th>Assistant 1</th><th>Assistant 2</th><th>Assistant 3</th><th>Mise à jour</th></tr></thead><tbody>'+(data||[]).map(l=>'<tr><td>'+esc(names[l.team_id]||l.team_id)+'</td><td>'+esc(l.captain||'—')+'</td><td>'+esc(l.assistant_1||'—')+'</td><td>'+esc(l.assistant_2||'—')+'</td><td>'+esc(l.assistant_3||'—')+'</td><td>'+new Date(l.updated_at).toLocaleString('fr-CA')+'</td></tr>').join('')+'</tbody></table>'}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),{error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){msg(error.message,'error');return}await boot()};$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};await boot();</script><script src="bhl-navigation.js?v=1" defer></script></body></html>
