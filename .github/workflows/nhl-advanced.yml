name: Statistiques avancées LNH BHL
on:
  schedule:
    - cron: '43 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bhl-advanced-stats
  cancel-in-progress: false
jobs:
  advanced:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculer les statistiques par 60 et percentiles
        run: python scripts/sync-nhl-advanced.py
      - name: Publier les statistiques
        run: |
          git config user.name "BHL Advanced Stats"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/nhl-advanced-stats.json /tmp/bhl-advanced-stats.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/bhl-advanced-stats.json data/nhl-advanced-stats.json
            git add data/nhl-advanced-stats.json
            if git diff --cached --quiet; then break; fi
            git commit -m "Actualiser les statistiques avancées LNH"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep 2
          done
