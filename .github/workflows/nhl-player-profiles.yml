name: Actualiser les profils officiels LNH
on:
  workflow_dispatch:
  schedule:
    - cron: '28 8 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-nhl-player-profiles.py'
      - '.github/workflows/nhl-player-profiles.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bhl-official-player-profiles
  cancel-in-progress: false
jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirmer les identités historiques et les statistiques officielles
        run: python scripts/sync-nhl-player-profiles.py
      - name: Publier les données des profils
        run: |
          git config user.name "BHL NHL Profiles"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historical-player-identities.json data/nhl-profile-stats.json data/player-profile-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser les identités historiques et les statistiques LNH"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deploy
