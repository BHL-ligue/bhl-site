name: Synchronisation Fantrax et publication
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-fantrax.py'
      - 'bhl-fantrax.html'
      - '.github/workflows/fantrax.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fantrax-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Récupérer les données Fantrax
        env:
          FANTRAX_COOKIE: ${{ secrets.FANTRAX_COOKIE }}
        run: python scripts/sync-fantrax.py
      - name: Vérifier les identités LNH
        run: python scripts/resolve-nhl-identities.py
      - name: Conserver le dernier instantané
        run: |
          git config user.name "BHL Fantrax Sync"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fantrax.json data/player-identity-map.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser les données Fantrax"
            # The scheduled run may overlap with another successful snapshot.
            # Discard only the generated snapshot commit, rebase on the newest
            # main and commit the latest snapshot again without a merge conflict.
            cp data/fantrax.json /tmp/bhl-fantrax-latest.json
            cp data/player-identity-map.json /tmp/bhl-identities-latest.json
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/bhl-fantrax-latest.json data/fantrax.json
              cp /tmp/bhl-identities-latest.json data/player-identity-map.json
              git add data/fantrax.json data/player-identity-map.json
              if git diff --cached --quiet; then
                break
              fi
              git commit -m "Actualiser les données Fantrax"
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Failed to publish Fantrax data after 5 attempts" >&2
                exit 1
              fi
              sleep 2
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
