name: PWHL API research (unpublished)
on:
  push:
    branches: [research/pwhl-fantasy-data]
    paths:
      - 'scripts/pwhl-api-probe.py'
      - 'scripts/pwhl-game-fpts.py'
      - 'scripts/pwhl-season-index.py'
      - 'scripts/pwhl-season-aggregate.py'
      - 'scripts/pwhl-batch-import.py'
      - '.github/workflows/pwhl-api-research.yml'
  workflow_dispatch:
concurrency:
  group: pwhl-research-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  api-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pwhl-fantasy-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query PWHL data API
        run: python scripts/pwhl-api-probe.py --output research/pwhl/api-probe-report.json
      - name: Compute experimental fantasy scores for a real game
        run: python scripts/pwhl-game-fpts.py
      - name: Index regular-season game IDs
        run: python scripts/pwhl-season-index.py
      - name: Import first twenty historical games
        run: python scripts/pwhl-batch-import.py --season 2025-26 --offset 0 --limit 20
      - name: Import next twenty historical games
        run: python scripts/pwhl-batch-import.py --season 2025-26 --offset 20 --limit 20
      - name: Import third twenty historical games
        run: python scripts/pwhl-batch-import.py --season 2025-26 --offset 40 --limit 20
      - name: Import fourth twenty historical games
        run: python scripts/pwhl-batch-import.py --season 2025-26 --offset 60 --limit 20
      - name: Import fifth twenty historical games
        run: python scripts/pwhl-batch-import.py --season 2025-26 --offset 80 --limit 20
      - name: Import final twenty historical games
        run: python scripts/pwhl-batch-import.py --season 2025-26 --offset 100 --limit 20
      - name: Aggregate available scored games
        shell: bash
        run: |
          shopt -s nullglob
          games=(research/pwhl/batch/2025-26/*.json)
          if (( ${#games[@]} > 0 )); then
            python scripts/pwhl-season-aggregate.py "${games[@]}" --output research/pwhl/season-aggregate-sample.json
          else
            echo "No completed games imported; skipping aggregate"
          fi
      - name: Commit research report only to research branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f research/pwhl/api-probe-report.json; then
            git add research/pwhl/api-probe-report.json
            if test -f research/pwhl/game-fpts-sample.json; then git add research/pwhl/game-fpts-sample.json; fi
            if test -f research/pwhl/season-game-index.json; then git add research/pwhl/season-game-index.json; fi
            if test -f research/pwhl/season-aggregate-sample.json; then git add research/pwhl/season-aggregate-sample.json; fi
            for manifest in research/pwhl/batch-manifest-*.json; do if test -f "$manifest"; then git add "$manifest"; fi; done
            if test -d research/pwhl/batch; then git add research/pwhl/batch/; fi
            if ! git diff --cached --quiet; then
              git commit -m "Record PWHL API feasibility results [skip ci]"
              git push origin HEAD:research/pwhl-fantasy-data
            fi
          fi
