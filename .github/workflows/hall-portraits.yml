name: Hall of Fame player portraits
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync-hall-portraits.py'
      - '.github/workflows/hall-portraits.yml'
  schedule:
    - cron: '20 7 * * 0'
permissions:
  contents: write
jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Download NHL portraits and audit coverage
        run: python scripts/sync-hall-portraits.py
      - name: Commit cached player photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/hall
          if ! git diff --cached --quiet; then
            git commit -m "Update Hall player portrait cache"
            git push
          fi
