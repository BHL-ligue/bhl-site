name: Reconstituer les pointeurs BHL
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-bhl-scorers.py'
      - 'scripts/build-home-leaders.py'
      - 'scripts/analyze-hit-discrepancies.py'
      - 'scripts/check-fantrax-hit-source.py'
      - '.github/workflows/scorers-build.yml'
      - 'scripts/audit-bhl-production.py'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bhl-scorers-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier le calcul
        run: python tests/test-production-audit.py
      - name: Conserver le relevé précédent pour contrôler la couverture
        run: cp data/production/scorers.json /tmp/bhl-scorers-before.json
      - name: Reconstituer les contributions des partants pour toutes les saisons
        run: python scripts/build-bhl-scorers.py
      - name: Préparer les meneurs de l’accueil et les liens de profils
        run: python scripts/build-home-leaders.py
      - name: Analyser les écarts de mises en échec 2023-24
        run: python scripts/analyze-hit-discrepancies.py
      - name: Comparer les catégories HIT de Fantrax aux valeurs brutes des matchups
        run: python scripts/check-fantrax-hit-source.py
      - name: Publier un résumé de couverture
        if: always()
        run: |
          if [ -f data/production/summary.json ]; then
            echo "## Reconstitution historique BHL" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat data/production/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "La reconstitution n'a pas produit de résumé. Consulter les logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Valider le fichier des pointeurs avant publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/production/scorers.json').read_text())
          summary=json.loads(Path('data/production/summary.json').read_text())
          assert data.get('careerRankingOfficial') is False
          assert data.get('status') == 'reconstructed'
          assert len(data.get('seasons',[])) >= 8
          assert len(data.get('rows',[])) > 0
          assert summary.get('records',0) == len(data['rows'])
          previous=json.loads(Path('/tmp/bhl-scorers-before.json').read_text())
          key=lambda r:(r['season'],r['phase'],r['id'],r['team'],r['positionGroup'])
          old={key(r):r for r in previous['rows']}
          new={key(r):r for r in data['rows']}
          for k,r in old.items():
            assert k in new and new[k]['starts'] >= r['starts'], ('Lost archived starts',k)
          assert sum(r['missingStarts'] for r in new.values()) <= sum(r['missingStarts'] for r in old.values()), 'Missing statistics increased'
          print('Provisional standings validated:', len(data['rows']), 'rows')
          PY
      - name: Publier les données provisoires pour la page historique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/production/starts.json data/production/scorers.json data/production/summary.json data/production/diagnostics.json data/production/hit-investigation-2023-24.json data/production/hit-player-evidence-2023-24.json data/production/hit-reconciliation-2023-24.csv data/production/fantrax-hit-source-check-2023-24.json data/home-top-scorers.json data/player-profile-index.json
          if ! git diff --cached --quiet; then
            git commit -m "Publier le classement historique BHL provisoire"
            # Changes to the website may land while the long scorer audit runs.
            # Replay only this generated-data commit on top of the latest main,
            # without overwriting any intervening website modifications.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Données BHL publiées avec succès (tentative $attempt)." >> "$GITHUB_STEP_SUMMARY"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Publication GitHub refusée après 5 tentatives." >&2
                exit 1
              fi
              sleep 2
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bhl-scorers-data
          path: data/production
          retention-days: 7

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deploy
