name: Historique d’appartenance BHL
on:
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/archive-fantrax-ownership.py'
      - '.github/workflows/ownership-history.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bhl-ownership-history
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actualiser les effectifs archivés de la saison en cours
        run: python scripts/archive-fantrax-ownership.py --current
      - name: Vérifier les archives et les identités
        run: python tests/test-ownership-data.py
      - name: Conserver les archives publiques
        run: |
          git config user.name "BHL Fantrax Sync"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ownership
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser l’historique d’appartenance BHL"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deploy
