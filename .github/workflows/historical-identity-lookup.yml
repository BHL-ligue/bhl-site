name: Retrouver les identites historiques BHL
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/lookup-historical-fantrax-identities.py'
      - '.github/workflows/historical-identity-lookup.yml'
permissions:
  contents: write
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Examiner les archives Fantrax
        run: python scripts/lookup-historical-fantrax-identities.py
      - name: Publier le diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/production/fantrax-historical-identity-lookup.json
          if ! git diff --cached --quiet; then
            git commit -m "Publier la recherche des identites historiques"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
