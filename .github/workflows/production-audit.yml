name: Contrôle de la production BHL 2025-26
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-bhl-production.py'
      - 'tests/test-production-audit.py'
      - '.github/workflows/production-audit.yml'
permissions:
  contents: read
concurrency:
  group: bhl-production-pilot
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les règles du calcul
        run: python tests/test-production-audit.py
      - name: Comparer les partants aux scores Fantrax pour toute la saison
        run: python scripts/audit-bhl-production.py
      - uses: actions/upload-artifact@v4
        with:
          name: bhl-production-audit-2025-26
          path: data/ownership/production-pilot.json
          retention-days: 7
