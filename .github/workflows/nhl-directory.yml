name: Répertoire officiel des joueurs LNH
on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nhl-directory
  cancel-in-progress: false
jobs:
  directory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchroniser les joueurs des 32 équipes LNH
        run: python scripts/sync-nhl-directory.py
      - name: Publier le répertoire
        run: |
          git config user.name "BHL NHL Directory"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/nhl-player-directory.json /tmp/bhl-nhl-directory.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/bhl-nhl-directory.json data/nhl-player-directory.json
            git add data/nhl-player-directory.json
            if git diff --cached --quiet; then
              break
            fi
            git commit -m "Actualiser le répertoire des joueurs LNH"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to publish NHL directory" >&2
              exit 1
            fi
            sleep 2
          done
