name: Identifier les joueurs historiques BHL
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/lookup-missing-fantrax-identities.py'
      - '.github/workflows/identity-lookup.yml'
permissions:
  contents: write
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rechercher les identités dans le répertoire Fantrax
        run: python scripts/lookup-missing-fantrax-identities.py
      - name: Publier le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/production/fantrax-missing-player-identities.json
          if ! git diff --cached --quiet; then
            git commit -m "Publier le diagnostic des identités historiques BHL"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 2
            done
          fi
