name: Comparer les joueurs inconnus aux statistiques LNH
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/match-missing-player-stats.py'
      - '.github/workflows/missing-player-stats.yml'
concurrency:
  group: bhl-historical-stat-candidates
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comparer les statistiques historiques
        run: python scripts/match-missing-player-stats.py
      - name: Publier les candidats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/production/fantrax-missing-player-stat-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Publier les candidats statistiques historiques"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --soft origin/main
              git reset
              git add data/production/fantrax-missing-player-stat-candidates.json
              git commit -m "Publier les candidats statistiques historiques" || exit 0
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
