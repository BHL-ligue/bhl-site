name: Examiner les profils historiques Fantrax
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-fantrax-historical-profiles.py'
      - '.github/workflows/historical-player-profiles.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Interroger les anciennes fiches Fantrax
        run: python scripts/probe-fantrax-historical-profiles.py
      - name: Publier le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/production/fantrax-historical-player-profiles.json
          if ! git diff --cached --quiet; then
            git commit -m "Publier le diagnostic des profils historiques Fantrax"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
