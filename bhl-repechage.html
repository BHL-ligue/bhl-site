<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BHL — Repêchage</title><link rel="stylesheet" href="bhl-navigation.css?v=1"><style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f5;color:#20252d;font:15px/1.5 Arial,sans-serif}main{max-width:1250px;margin:28px auto;padding:0 18px}h1{font-size:36px;margin:0 0 4px}.eyebrow{font-size:12px;color:#c00;font-weight:900;letter-spacing:.12em}.muted{color:#657180}.panel{background:#fff;border:1px solid #e1e5e9;border-radius:13px;padding:22px;margin:18px 0}h2{margin:0 0 12px;font-size:21px}.filters{display:flex;flex-wrap:wrap;gap:12px}.filters label{font-size:13px;font-weight:700;flex:1;min-width:150px}.filters select{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #c7cdd5;border-radius:8px;background:white;font:inherit}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 0}.tabs button{border:1px solid #d7dce3;background:white;color:#334155;padding:12px 17px;border-radius:9px 9px 0 0;font-weight:800;cursor:pointer}.tabs button[aria-selected=true]{background:#cc0000;color:white;border-color:#cc0000}.scroll{overflow:auto}main table{width:100%;border-collapse:collapse;min-width:700px}main th{text-align:left;background:#f1f3f6;color:#475569;font-size:12px}main th,main td{padding:12px;border-bottom:1px solid #e7e9ed}tbody tr:hover{background:#fafbfc}.number{font-weight:900;color:#a50000}.note{padding:14px;border-radius:9px;background:#fff7e8;color:#735019}.hidden{display:none}@media(max-width:600px){main{padding:0 11px}h1{font-size:29px}.panel{padding:14px}}
 .draft-logo{width:30px;height:30px;object-fit:contain;flex-shrink:0}.draft-team{display:inline-flex;align-items:center;gap:9px;white-space:nowrap}td:has(>.draft-logo){white-space:nowrap}
/* Draft night cards */
.round-block{margin:22px 0 30px;border:1px solid #e2e6ec;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 7px 26px #20252d0a}.round-heading{display:flex;align-items:center;gap:15px;flex-wrap:wrap;padding:17px 22px;background:#172232;color:#fff;border-left:6px solid #cc0000}.round-heading h3{font-size:20px;margin:0;font-weight:900;letter-spacing:-.02em}.round-heading .round-meta{margin-left:auto;font-size:12px;color:#c7d1de;font-weight:700}.round-badge{background:#ffffff22;border:1px solid #ffffff40;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:900;letter-spacing:.09em}.round-amateur .round-heading{background:linear-gradient(110deg,#a40000,#cc0000 68%,#e74646);border-left-color:#f3c778}.round-amateur .round-badge{background:#fff;color:#a40000;border-color:#fff}.round-amateur .round-meta{color:#fff}.round-amateur{border-color:#e9b5b5;box-shadow:0 10px 30px #cc000012}.round-block table{min-width:640px}.round-block tbody tr:last-child td{border-bottom:0}.round-block td:first-child{font-weight:850;color:#aa0000}.round-year{margin:26px 0 10px;padding:10px 0;border-bottom:2px solid #e1e5e9;font-size:25px;font-weight:900;color:#172232}.round-year:first-child{margin-top:6px}.round-block .scroll{overflow-x:auto}@media(max-width:600px){.round-heading{padding:14px;gap:9px}.round-heading h3{font-size:17px}.round-heading .round-meta{margin-left:0;width:100%}.round-year{font-size:22px}}

.round-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.round-grid .round-block{margin:0;min-width:0}
.round-grid table{min-width:0;width:100%}
.round-grid th,.round-grid td{padding:10px 8px}
.round-grid th:first-child,.round-grid td:first-child{width:54px;text-align:center}
.round-grid .draft-logo{width:25px;height:25px}
.round-grid .draft-team{gap:7px;white-space:normal}
.round-grid .round-heading{padding:13px}
.round-grid .round-heading h3{font-size:17px}
.draft-player-link{border:0;background:none;color:#a50000;font:inherit;font-weight:800;text-align:left;cursor:pointer;padding:5px 0}
.draft-player-link:hover{text-decoration:underline;color:#cc0000}
.draft-player-link:focus-visible{outline:2px solid #cc0000;outline-offset:2px}
@media(max-width:1000px){.round-grid{grid-template-columns:1fr}.round-grid table{min-width:580px}}
</style></head><body><div id="bhl-global-nav"></div><main><div class="eyebrow">BÉLIVEAU HOCKEY LEAGUE</div><h1>Repêchage</h1><p class="muted">Choix actuels et futurs, échanges de choix et résultats des repêchages — données Fantrax.</p><p id="sync" role="status">Chargement…</p><div id="content" hidden><div class="tabs" role="tablist" aria-label="Sections du repêchage"><button type="button" id="tab-picks" role="tab" aria-selected="true">Choix au repêchage</button><button type="button" id="tab-results" role="tab" aria-selected="false">Historique des repêchages</button></div><section class="panel"><div class="filters"><label>Année<select id="year"><option value="">Toutes les années</option></select></label><label>Équipe propriétaire<select id="team"><option value="">Toutes les équipes</option></select></label><label>Ronde<select id="round"><option value="">Toutes les rondes</option></select></label></div><p id="count" class="muted"></p><div id="rows" class="scroll"></div></section></div></main><script src="bhl-trades.js?v=global3"></script><script src="bhl-navigation.js?v=global3" defer></script><script src="data/fantrax-player-stats.js?v=20261102"></script><link rel="stylesheet" href="bhl-player-stats.css?v=single20261102"><script src="bhl-player-stats.js?v=averagetimeorder20261102" defer></script><script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])),value=(v,fallback='—')=>v==null||v===''?fallback:String(v);
let draft={},teamNames={},mode='picks';
const SHEET_ID='1KtgVk6viZc6wMMKoxBhbUgL6JkjuwuMTyfNH173XWUc';
const LOGOS={'anaheim mighty ducks':'anaheim-mightyducks.png','atlanta thrashers':'atlanta-thrashers.png','boston bruins':'boston-bruins.png','cleveland barons':'cleveland-barons.png','california golden seals':'california-goldenseals.png','chicago blackhawks':'chicago-blackhawks.png','colorado avalanche':'colorado-avalanche.png','detroit red wings':'detroit-redwings.png','detroit cougars':'detroit-cougars.png','edmonton oilers':'edmonton-oilers.png','florida panthers':'florida-panthers.png','hartford whalers':'hartford-whalers.png','minnesota north stars':'minnesota-northstars.png','montreal canadiens':'montreal-canadiens.png','montreal maroons':'montreal-maroons.png','nashville predators':'nashville-predators.png','new york rangers':'newyork-rangers.png','ottawa senators':'ottawa-senators.png','quebec nordiques':'quebec-nordiques.png','toronto maple leafs':'toronto-mapleleafs.png','vegas golden knights':'vegas-golden-knights.png','winnipeg jets':'winnipeg-jets.png'};
const normalizeTeam=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function teamWithLogo(name){const file=LOGOS[normalizeTeam(name)];return '<span class="draft-team">'+(file?'<img class="draft-logo" src="logos/'+encodeURIComponent(file)+'" alt="" loading="lazy">':'')+'<span>'+esc(name||'—')+'</span></span>'}
function playerLink(p){const name=value(p.playerName||p.playerId),team=p.teamName||teamNames[p.teamId]||teamNames[p.currentOwnerTeamId]||'';return '<button type="button" class="draft-player-link" data-bhl-player-name="'+esc(name)+'" data-bhl-player-id="" data-bhl-team="'+esc(team)+'">'+esc(name)+' ↗</button>'}
function parseCSV(text){const out=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v!==''))out.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>v!==''))out.push(row);return out}
async function loadDraftHistory(){const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&sheet=DRAFTS';const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw Error('Onglet DRAFTS non accessible');const records=parseCSV(await res.text());if(!records.length)throw Error('Onglet DRAFTS vide');const h=records.shift().map(v=>v.trim().toLowerCase());const idx=name=>h.indexOf(name.toLowerCase());const get=(row,name)=>row[idx(name)]||'';const yearIndex=h.findIndex(v=>v==='year'||v==='season'||v==='année'||v==='annee');const actualYearIndex=yearIndex>=0?yearIndex:(h.length>9?9:-1);const items=records.map(row=>({playerId:get(row,'Player ID').replace(/\*/g,''),playerName:get(row,'Player'),round:Number(get(row,'Round')),pick:Number(get(row,'Ov Pick')),teamName:get(row,'Fantasy Team'),year:actualYearIndex>=0&&Number(row[actualYearIndex])>=2000?Number(row[actualYearIndex]):null})).filter(x=>x.playerName&&x.round&&x.pick);if(!items.length)throw Error('Aucun choix historique valide');return items}

function options(id,values,display){const el=$(id),previous=el.value;el.replaceChildren(new Option(id==='year'?'Toutes les années':id==='round'?'Toutes les rondes':'Toutes les équipes',''),...values.map(v=>new Option(display?display(v):String(v),String(v))));el.value=values.map(String).includes(previous)?previous:''}
function currentRows(){return mode==='picks'?[...(draft.currentPicks||[]),...(draft.futurePicks||[])]:draft.results||[]}
function draw(){const source=currentRows();const years=[...new Set(source.map(p=>p.year??(mode==='results'?draft.draftYear:null)).filter(v=>v!=null))].sort((a,b)=>Number(b)-Number(a));const rounds=[...new Set(source.map(p=>p.round).filter(v=>v!=null))].sort((a,b)=>Number(a)-Number(b));options('year',years);options('round',rounds);const ids=[...new Set(source.flatMap(p=>[p.currentOwnerTeamId,p.teamId,p.teamName].filter(Boolean)))].sort((a,b)=>(teamNames[a]||a).localeCompare(teamNames[b]||b,'fr'));options('team',ids,v=>teamNames[v]||v);
const rows=source.filter(p=>(!$('year').value||String(p.year??(mode==='results'?draft.draftYear:''))===$('year').value)&&(!$('round').value||String(p.round)===$('round').value)&&(!$('team').value||String(p.currentOwnerTeamId||p.teamId||p.teamName)===$('team').value)).sort((a,b)=>Number(b.year||draft.draftYear||0)-Number(a.year||draft.draftYear||0)||Number(a.round||0)-Number(b.round||0)||Number(a.pick||a.pickNumber||0)-Number(b.pick||b.pickNumber||0));
$('count').textContent=rows.length+' choix affiché(s)';
if(!rows.length){$('rows').innerHTML='<p class="note">'+(mode==='results'?'L’API publique retourne des informations sur le repêchage, mais pas encore les joueurs sélectionnés. L’historique détaillé sera affiché lorsque les sélections pourront être confirmées.':'Aucun choix correspondant aux filtres.')+'</p>';return}
const byYear=new Map();
for(const p of rows){
 const year=p.year??(mode==='results'?draft.draftYear:null);
 const key=year==null?'Année inconnue':String(year);
 if(!byYear.has(key))byYear.set(key,new Map());
 const group=byYear.get(key),round=Number(p.round)||0;
 if(!group.has(round))group.set(round,[]);
 group.get(round).push(p);
}
$('rows').innerHTML=[...byYear].map(([year,rounds])=>{
 const blocks=[...rounds].sort((a,b)=>a[0]-b[0]).map(([round,picks])=>{
  const amateur=mode==='results'&&round===1&&year!=='2018'&&year!=='Année inconnue';
  const heading=amateur?'Repêchage amateur':round===1&&year==='2018'?'Première ronde':'Ronde '+round;
  const headers=mode==='picks'?'<th>Année</th><th>Propriétaire actuel</th><th>Équipe d’origine</th><th>Échangé?</th>':'<th>Choix</th><th>Organisation</th><th>Joueur</th>';
  const body=picks.map(p=>mode==='picks'
   ?'<tr><td>'+esc(value(p.year))+'</td><td>'+teamWithLogo(teamNames[p.currentOwnerTeamId]||value(p.currentOwnerTeamId))+'</td><td>'+teamWithLogo(teamNames[p.originalOwnerTeamId]||value(p.originalOwnerTeamId))+'</td><td>'+(p.currentOwnerTeamId&&p.originalOwnerTeamId&&p.currentOwnerTeamId!==p.originalOwnerTeamId?'Oui':'Non')+'</td></tr>'
   :'<tr><td>'+esc(value(p.overallPick??p.pickNumber??p.pick))+'</td><td>'+teamWithLogo(teamNames[p.teamId]||value(p.teamName||p.teamId))+'</td><td>'+playerLink(p)+'</td></tr>'
  ).join('');
  return '<section class="round-block'+(amateur?' round-amateur':'')+'"><header class="round-heading"><span class="round-badge">'+(amateur?'RELÈVE BHL':'RONDE '+esc(round))+'</span><h3>'+heading+'</h3><span class="round-meta">'+picks.length+' choix · '+esc(year)+'</span></header><div class="scroll"><table><thead><tr>'+headers+'</tr></thead><tbody>'+body+'</tbody></table></div></section>';
 }).join('');
 return '<h2 class="round-year">'+esc(year)+'</h2><div class="round-grid">'+blocks+'</div>';
}).join('');
}
async function load(){try{const response=await fetch('data/fantrax.json',{cache:'no-store'});if(!response.ok)throw Error('Données indisponibles');const data=await response.json();draft=data.draft||{};try{const history=await loadDraftHistory();draft.results=history;draft.draftYear=null;draft.historySource='Google Sheets — DRAFTS'}catch(error){console.warn('Historique Sheets indisponible, utilisation du repêchage Fantrax',error.message)}teamNames=Object.fromEntries((data.teams||[]).map(t=>[t.id,t.name]));$('sync').textContent='Dernière synchronisation Fantrax : '+new Date(data.updatedAt).toLocaleString('fr-CA',{timeZone:'America/Toronto'})+(draft.historySource?' · Historique : '+draft.historySource:'');$('content').hidden=false;draw()}catch(e){$('sync').textContent='Impossible de charger les données : '+e.message}}
// Les joueurs utilisent le gestionnaire commun de bhl-player-stats.js.
['year','team','round'].forEach(id=>$(id).addEventListener('change',draw));[['tab-picks','picks'],['tab-results','results']].forEach(([id,m])=>$(id).addEventListener('click',()=>{mode=m;for(const [other,otherMode] of [['tab-picks','picks'],['tab-results','results']])$(other).setAttribute('aria-selected',String(otherMode===mode));$('year').value='';$('team').value='';$('round').value='';draw()}));load();
</script></body></html>
