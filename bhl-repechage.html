<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BHL — Repêchage</title><link rel="stylesheet" href="bhl-navigation.css?v=1"><style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f5;color:#20252d;font:15px/1.5 Arial,sans-serif}main{max-width:1250px;margin:28px auto;padding:0 18px}h1{font-size:36px;margin:0 0 4px}.eyebrow{font-size:12px;color:#c00;font-weight:900;letter-spacing:.12em}.muted{color:#657180}.panel{background:#fff;border:1px solid #e1e5e9;border-radius:13px;padding:22px;margin:18px 0}h2{margin:0 0 12px;font-size:21px}.filters{display:flex;flex-wrap:wrap;gap:12px}.filters label{font-size:13px;font-weight:700;flex:1;min-width:150px}.filters select{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #c7cdd5;border-radius:8px;background:white;font:inherit}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 0}.tabs button{border:1px solid #d7dce3;background:white;color:#334155;padding:12px 17px;border-radius:9px 9px 0 0;font-weight:800;cursor:pointer}.tabs button[aria-selected=true]{background:#cc0000;color:white;border-color:#cc0000}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th{text-align:left;background:#f1f3f6;color:#475569;font-size:12px}th,td{padding:12px;border-bottom:1px solid #e7e9ed}tbody tr:hover{background:#fafbfc}.number{font-weight:900;color:#a50000}.note{padding:14px;border-radius:9px;background:#fff7e8;color:#735019}.hidden{display:none}@media(max-width:600px){main{padding:0 11px}h1{font-size:29px}.panel{padding:14px}}
</style></head><body><div id="bhl-global-nav"></div><main><div class="eyebrow">BÉLIVEAU HOCKEY LEAGUE</div><h1>Repêchage</h1><p class="muted">Choix actuels et futurs, échanges de choix et résultats des repêchages — données Fantrax.</p><p id="sync" role="status">Chargement…</p><div id="content" hidden><div class="tabs" role="tablist" aria-label="Sections du repêchage"><button type="button" id="tab-picks" role="tab" aria-selected="true">Choix au repêchage</button><button type="button" id="tab-results" role="tab" aria-selected="false">Historique des repêchages</button></div><section class="panel"><div class="filters"><label>Année<select id="year"><option value="">Toutes les années</option></select></label><label>Équipe propriétaire<select id="team"><option value="">Toutes les équipes</option></select></label><label>Ronde<select id="round"><option value="">Toutes les rondes</option></select></label></div><p id="count" class="muted"></p><div id="rows" class="scroll"></div></section></div></main><script src="bhl-navigation.js?v=global3" defer></script><script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])),value=(v,fallback='—')=>v==null||v===''?fallback:String(v);
let draft={},teamNames={},mode='picks';
function options(id,values,display){const el=$(id),previous=el.value;el.replaceChildren(new Option(id==='year'?'Toutes les années':id==='round'?'Toutes les rondes':'Toutes les équipes',''),...values.map(v=>new Option(display?display(v):String(v),String(v))));el.value=values.map(String).includes(previous)?previous:''}
function currentRows(){return mode==='picks'?[...(draft.currentPicks||[]),...(draft.futurePicks||[])]:draft.results||[]}
function draw(){const source=currentRows();const years=[...new Set(source.map(p=>p.year).filter(v=>v!=null))].sort((a,b)=>Number(b)-Number(a));const rounds=[...new Set(source.map(p=>p.round).filter(v=>v!=null))].sort((a,b)=>Number(a)-Number(b));options('year',years);options('round',rounds);const ids=[...new Set(source.flatMap(p=>[p.currentOwnerTeamId,p.teamId].filter(Boolean)))].sort((a,b)=>(teamNames[a]||a).localeCompare(teamNames[b]||b,'fr'));options('team',ids,v=>teamNames[v]||v);
const rows=source.filter(p=>(!$('year').value||String(p.year)===$('year').value)&&(!$('round').value||String(p.round)===$('round').value)&&(!$('team').value||String(p.currentOwnerTeamId||p.teamId)===$('team').value)).sort((a,b)=>Number(b.year||0)-Number(a.year||0)||Number(a.round||0)-Number(b.round||0)||Number(a.pick||a.pickNumber||0)-Number(b.pick||b.pickNumber||0));
$('count').textContent=rows.length+' choix affiché(s)';
if(!rows.length){$('rows').innerHTML='<p class="note">'+(mode==='results'?'L’API publique retourne des informations sur le repêchage, mais pas encore les joueurs sélectionnés. L’historique détaillé sera affiché lorsque les sélections pourront être confirmées.':'Aucun choix correspondant aux filtres.')+'</p>';return}
if(mode==='picks')$('rows').innerHTML='<table><thead><tr><th>Année</th><th>Ronde</th><th>Propriétaire actuel</th><th>Équipe d’origine</th><th>Échangé?</th></tr></thead><tbody>'+rows.map(p=>'<tr><td class="number">'+esc(value(p.year))+'</td><td>'+esc(value(p.round))+'</td><td>'+esc(teamNames[p.currentOwnerTeamId]||value(p.currentOwnerTeamId))+'</td><td>'+esc(teamNames[p.originalOwnerTeamId]||value(p.originalOwnerTeamId))+'</td><td>'+(p.currentOwnerTeamId&&p.originalOwnerTeamId&&p.currentOwnerTeamId!==p.originalOwnerTeamId?'Oui':'Non')+'</td></tr>').join('')+'</tbody></table>';
else $('rows').innerHTML='<table><thead><tr><th>Année</th><th>Ronde</th><th>Choix</th><th>Organisation</th><th>Joueur</th></tr></thead><tbody>'+rows.map(p=>'<tr><td>'+esc(value(p.year))+'</td><td>'+esc(value(p.round))+'</td><td>'+esc(value(p.overallPick??p.pickNumber??p.pick))+'</td><td>'+esc(teamNames[p.teamId]||value(p.teamName||p.teamId))+'</td><td>'+esc(value(p.playerName||p.playerId))+'</td></tr>').join('')+'</tbody></table>';
}
async function load(){try{const response=await fetch('data/fantrax.json',{cache:'no-store'});if(!response.ok)throw Error('Données indisponibles');const data=await response.json();draft=data.draft||{};teamNames=Object.fromEntries((data.teams||[]).map(t=>[t.id,t.name]));$('sync').textContent='Dernière synchronisation : '+new Date(data.updatedAt).toLocaleString('fr-CA',{timeZone:'America/Toronto'});$('content').hidden=false;draw()}catch(e){$('sync').textContent='Impossible de charger les données : '+e.message}}
['year','team','round'].forEach(id=>$(id).addEventListener('change',draw));[['tab-picks','picks'],['tab-results','results']].forEach(([id,m])=>$(id).addEventListener('click',()=>{mode=m;for(const [other,otherMode] of [['tab-picks','picks'],['tab-results','results']])$(other).setAttribute('aria-selected',String(otherMode===mode));$('year').value='';$('team').value='';$('round').value='';draw()}));load();
</script></body></html>
