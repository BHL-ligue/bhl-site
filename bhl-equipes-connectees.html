<p class="note">Données chargées depuis le classeur BHL. Les fiches utilisent les lignes de statistiques et d’historique des onglets d’équipe. Les saisons, statistiques FPTS et distinctions sont séparées selon les tableaux du classeur.</p><footer class="footer">BHL · Béliveau Hockey League · Version de test connectée</footer></main>
<script>
const API='https://script.google.com/macros/s/AKfycbyhz6nFb1gR_JiNF6VLl_8q-nUjo7OkbB9hNqSzZVdc4n_hZhUKQ3aTu3YqGTJCrjARiQ/exec';
const TEAMS=[['ANAHEIM','ANAHEIM MIGHTY DUCKS'],['ATLANTA','ATLANTA THRASHERS'],['CLEVELAND','BOSTON BRUINS'],['CALIFORNIE','CALIFORNIA GOLDEN SEALS'],['CHICAGO','CHICAGO BLACKHAWKS'],['COLORADO','COLORADO AVALANCHE'],['DETROIT','DETROIT RED WINGS'],['FLORIDA','FLORIDA PANTHERS'],['HARTFORD','HARTFORD WHALERS'],['MINNESOTA','MINNESOTA NORTH STARS'],['MONTREAL','MONTRÉAL CANADIENS'],['NASHVILLE','NASHVILLE PREDATORS'],['NEWYORK','NEW YORK RANGERS'],['OTTAWA','OTTAWA SENATORS'],['QUÉBEC','QUÉBEC NORDIQUES'],['TORONTO','TORONTO MAPLE LEAFS']].map(([sheet,name])=>({sheet,name}));
const $=s=>document.querySelector(s); let teamData={}, forbesData=[]; let selected='MONTREAL'; let currentTab='overview';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v===null||v===undefined||v==='')return null;const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:null};
const fmt=(v,d=0)=>v===null||v===undefined||v===''?'—':Number.isFinite(Number(v))?Number(v).toLocaleString('fr-CA',{maximumFractionDigits:d}):v;
const pct=v=>v===null||v===undefined||v===''?'—':(Number(v)*100).toLocaleString('fr-CA',{maximumFractionDigits:1})+' %';
const money=v=>v===null||v===undefined?'—':Number(v).toLocaleString('fr-CA',{maximumFractionDigits:1})+' M$';
function jsonp(sheet){return new Promise((resolve,reject)=>{const cb='bhlcb_'+sheet.toLowerCase().replace(/[^a-z0-9]/g,'')+'_'+Date.now();const script=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('Timeout API '+sheet));},20000);function cleanup(){clearTimeout(timer);try{delete window[cb]}catch(e){window[cb]=undefined}script.remove()}window[cb]=data=>{cleanup();resolve(data)};script.onerror=()=>{cleanup();reject(new Error('Impossible de charger '+sheet))};script.src=API+'?sheet='+encodeURIComponent(sheet)+'&callback='+cb;document.body.appendChild(script);});}
function status(msg,type=''){const el=$('#status');el.textContent=msg;el.className='status '+type;}
function parseTeam(sheet,obj){
 const rows=obj?.rows||[], summary=rows[8]||[];
 const title=(rows[5]||[])[0]||TEAMS.find(t=>t.sheet===sheet)?.name||sheet;
 const seasons=[];
 // Les saisons sont aux lignes 12 à 19 du classeur (index 11 à 18).
 for(let i=11;i<=18;i++){const r=rows[i]||[];if(!r[3]||!String(r[3]).match(/\d{4}/))continue;
  seasons.push({team:r[2]||title,season:r[3],rank:num(r[5]),wins:num(r[6]),losses:num(r[7]),ties:num(r[8]),points:num(r[9]),winPct:num(r[10]),pointsFor:num(r[11]),pointsAgainst:num(r[12]),result:r[13]||'',opponent:r[14]||''});
 }
 // Le palmarès commence à la ligne 22; on lit ses colonnes propres.
 const honours=[];
 for(let i=21;i<rows.length;i++){const r=rows[i]||[];if(!r[6]||!r[3])continue;
  honours.push({team:r[2]||title,season:r[3],award:r[6],winner:r[10]||'',detail:r[13]??''});
 }
 return {sheet,name:TEAMS.find(t=>t.sheet===sheet)?.name||title,cumulative:{games:num(summary[5]),wins:num(summary[6]),losses:num(summary[7]),ties:num(summary[8]),points:num(summary[9]),winPct:num(summary[10]),pointsFor:num(summary[11]),pointsAgainst:num(summary[12]),trades:num(summary[13]),claims:num(summary[14])},seasons,honours};
}
const LOGOS={
 'ANAHEIM MIGHTY DUCKS':'anaheim-mightyducks.png','ATLANTA THRASHERS':'atlanta-thrashers.png',
 'BOSTON BRUINS':'boston-bruins.png','CLEVELAND BARONS':'cleveland-barons.png',
 'CALIFORNIA GOLDEN SEALS':'california-goldenseals.png','CHICAGO BLACKHAWKS':'chicago-blackhawks.png',
 'COLORADO AVALANCHE':'colorado-avalanche.png','DETROIT RED WINGS':'detroit-redwings.png',
 'FLORIDA PANTHERS':'florida-panthers.png','HARTFORD WHALERS':'hartford-whalers.png',
 'MINNESOTA NORTH STARS':'minnesota-northstars.png','MONTREAL CANADIENS':'montreal-canadiens.png',
 'MONTREAL MAROONS':'montreal-maroons.png','NASHVILLE PREDATORS':'nashville-predators.png',
 'NEW YORK RANGERS':'newyork-rangers.png','OTTAWA SENATORS':'ottawa-senators.png','EDMONTON OILERS':'edmonton-oilers.png',
 'QUEBEC NORDIQUES':'quebec-nordiques.png','TORONTO MAPLE LEAFS':'toronto-mapleleafs.png',
 'VEGAS GOLDEN KNIGHTS':'vegas-goldenknights.png','WINNIPEG JETS':'winnipeg-jets.png'
};
const TEAM_COLORS={
 'ANAHEIM MIGHTY DUCKS':'#532A44','ATLANTA THRASHERS':'#5c88da','BOSTON BRUINS':'#ffb81c','CLEVELAND BARONS':'#b5a36a','CALIFORNIA GOLDEN SEALS':'#007f00','CHICAGO BLACKHAWKS':'#cf0a2c','COLORADO AVALANCHE':'#6f263d','DETROIT RED WINGS':'#ce1126','FLORIDA PANTHERS':'#c8102e','HARTFORD WHALERS':'#046A38','MINNESOTA NORTH STARS':'#009639','MONTREAL CANADIENS':'#af1e2d','MONTREAL MAROONS':'#6d1f2a','NASHVILLE PREDATORS':'#ffb81c','NEW YORK RANGERS':'#0038a8','OTTAWA SENATORS':'#DA1A32','EDMONTON OILERS':'#ff4c00','QUEBEC NORDIQUES':'#005eb8','TORONTO MAPLE LEAFS':'#00205b','VEGAS GOLDEN KNIGHTS':'#B4975A','WINNIPEG JETS':'#041e42'};
function teamColor(name){return TEAM_COLORS[normalizeTeam(name)]||'#cc0000';}

function normalizeTeam(name){return String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function teamLogo(name){const file=LOGOS[normalizeTeam(name)];return file?`<img class="teamlogo" src="./logos/${file}" alt="" onerror="this.style.display='none'">`:'';}

function rankFor(name){const r=forbesData.find(x=>String(x[2]||'').toUpperCase()===name.toUpperCase());return r?num(r[3]):null;}
function initials(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(s=>s[0]).join('');}
function drawTeams(){const sel=$('#teamSelect'),nav=$('#teamnav');sel.innerHTML='';nav.innerHTML='';TEAMS.forEach(t=>{const o=document.createElement('option');o.value=t.sheet;o.textContent=t.name;sel.append(o);const b=document.createElement('button');b.className='teamchip';b.dataset.sheet=t.sheet;b.textContent=t.name.replace('MIGHTY DUCKS','DUCKS').replace('GOLDEN SEALS','SEALS');b.onclick=()=>choose(t.sheet);nav.append(b)});sel.value=selected;sel.onchange=()=>choose(sel.value);}
function choose(sheet){selected=sheet;const t=teamData[sheet];if(!t){status('Les données de cette équipe ne sont pas disponibles.','error');return;}document.documentElement.style.setProperty('--team-color',teamColor(t.name));$('#teamSelect').value=sheet;document.querySelectorAll('.teamchip').forEach(b=>b.classList.toggle('active',b.dataset.sheet===sheet));$('#teamName').textContent=t.name;$('#crest').innerHTML=teamLogo(t.name)||initials(t.name);$('#teamKicker').textContent='Fiche officielle';$('#teamSub').textContent=t.seasons.length+' saisons répertoriées · Données Google Sheets';$('#forbesRank').textContent='#'+(rankFor(t.name)??'—');const c=t.cumulative;const stats=[['Matchs joués',c.games],['Victoires',c.wins],['Défaites',c.losses],['% victoires',pct(c.winPct)],['Points',c.points],['Valeur FORBES',money((forbesData.find(r=>String(r[2]||'').toUpperCase()===t.name.toUpperCase())||[])[4])]];$('#stats').innerHTML=stats.map(([l,v])=>`<div class="stat"><div class="label">${l}</div><div class="value">${typeof v==='string'?esc(v):fmt(v)}</div><small>${l==='Valeur FORBES'?'Classeur de la ligue':'Bilan cumulatif'}</small></div>`).join('');renderPanel();}
function renderPanel(){const t=teamData[selected];if(!t)return;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab));if(currentTab==='overview'){const c=t.cumulative;$('#panel').innerHTML=`<div class="cards2"><div class="card"><div class="kicker">Bilan historique</div><h3>Performance cumulative</h3><table style="min-width:0"><tbody><tr><td>Points</td><td style="text-align:right"><b>${fmt(c.points)}</b></td></tr><tr><td>PTSF</td><td style="text-align:right"><b>${fmt(c.pointsFor,1)}</b></td></tr><tr><td>PTSA</td><td style="text-align:right"><b>${fmt(c.pointsAgainst,1)}</b></td></tr><tr><td>Échanges</td><td style="text-align:right"><b>${fmt(c.trades)}</b></td></tr><tr><td>Claims</td><td style="text-align:right"><b>${fmt(c.claims)}</b></td></tr></tbody></table></div><div class="card"><div class="kicker">Saisons récentes</div><h3>Derniers résultats</h3>${t.seasons.slice(0,4).map(s=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)"><div><b>${esc(s.season)}</b><div style="font-size:11px;color:var(--muted)">${esc(s.team)}</div></div><div style="text-align:right"><b>${fmt(s.wins)}–${fmt(s.losses)}</b><div style="font-size:11px;color:var(--muted)">${esc(s.result||'Résultat non indiqué')}</div></div></div>`).join('')}</div></div>`;}
if(currentTab==='seasons'){$('#panel').innerHTML=`<div class="section-head"><div><h3>Historique des saisons</h3><p>Historique récupéré depuis l’onglet ${esc(t.sheet)}.</p></div><input id="seasonSearch" style="max-width:260px" placeholder="Filtrer les saisons…"></div><div class="tablewrap"><table><thead><tr><th>Saison</th><th>Nom d’équipe</th><th>Rang</th><th>V</th><th>D</th><th>PTS</th><th>% V</th><th>FPTS Pour</th><th>FPTS Contre</th><th>Résultat</th><th>Adversaire</th></tr></thead><tbody id="seasonRows"></tbody></table></div>`;const draw=()=>{const q=$('#seasonSearch').value.toLowerCase();$('#seasonRows').innerHTML=t.seasons.filter(s=>JSON.stringify(s).toLowerCase().includes(q)).map(s=>`<tr><td><b>${esc(s.season)}</b></td><td>${teamLogo(s.team)}${esc(s.team)}</td><td>${fmt(s.rank)}</td><td>${fmt(s.wins)}</td><td>${fmt(s.losses)}</td><td>${fmt(s.points)}</td><td>${pct(s.winPct)}</td><td>${fmt(s.pointsFor,2)}</td><td>${fmt(s.pointsAgainst,2)}</td><td><span class="pill">${esc(s.result||'—')}</span></td><td>${esc(s.opponent||'—')}</td></tr>`).join('')||'<tr><td colspan="11">Aucune saison correspondante.</td></tr>'};$('#seasonSearch').addEventListener('input',draw);draw();}
if(currentTab==='honours'){$('#panel').innerHTML=`<div class="section-head"><div><h3>Palmarès et distinctions</h3><p>${t.honours.length} distinction(s) répertoriée(s) dans le classeur.</p></div></div><div class="tablewrap"><table><thead><tr><th>Saison</th><th>Équipe</th><th>Distinction</th><th>Gagnant</th><th>Détail</th></tr></thead><tbody>${t.honours.map(h=>`<tr><td><b>${esc(h.season)}</b></td><td>${teamLogo(h.team)}${esc(h.team)}</td><td><span class="pill">${esc(h.award)}</span></td><td>${esc(h.winner||'—')}</td><td>${esc(h.detail||'—')}</td></tr>`).join('')||'<tr><td colspan="5">Aucune distinction répertoriée.</td></tr>'}</tbody></table></div>`;}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{currentTab=b.dataset.tab;renderPanel()}));
(async()=>{try{status('Loading live data from Google Sheets…');const [teamsResp,forbesResp]=await Promise.all([jsonp('TEAMS'),jsonp('FORBES')]);if(!teamsResp.ok||!forbesResp.ok)throw new Error('L’API a renvoyé une réponse invalide.');forbesData=(forbesResp.data?.rows||[]).slice(2);for(const t of TEAMS){const raw=teamsResp.teams?.[t.sheet];if(raw&&!raw.error)teamData[t.sheet]=parseTeam(t.sheet,raw)}drawTeams();if(!Object.keys(teamData).length)throw new Error('Aucune fiche d’équipe n’a été reçue.');status('Connected · données reçues pour '+Object.keys(teamData).length+' équipes depuis Google Sheets.','ok');choose(selected); }catch(e){status('Connexion impossible : '+e.message+'. Vérifie que la version déployée inclut le code JSONP.','error');$('#teamName').textContent='Connexion non disponible';$('#panel').innerHTML='<div class="card">Les données n’ont pas pu être chargées. Recharge la page après avoir vérifié le déploiement de l’API.</div>';}})();
</script>
<script>
(function(){
  const nav = document.querySelector('.nav');
  const links = nav && nav.querySelector('nav.links, nav.navlinks');
  if (!nav || !links || nav.querySelector('.menu-toggle')) return;
  const button = document.createElement('button');
  button.className = 'menu-toggle';
  button.type = 'button';
  button.setAttribute('aria-expanded','false');
  button.setAttribute('aria-label','Ouvrir le menu');
  button.innerHTML = '<span class="hamburger" aria-hidden="true">☰</span><span>MENU</span>';
  links.id = links.id || 'bhl-mobile-navigation';
  button.setAttribute('aria-controls', links.id);
  const brand = nav.querySelector('.brand');
  if (brand && brand.nextSibling) nav.insertBefore(button, brand.nextSibling);
  else nav.insertBefore(button, links);
  button.addEventListener('click', function(){
    const open = links.classList.toggle('is-open');
    button.setAttribute('aria-expanded', String(open));
    button.setAttribute('aria-label', open ? 'Fermer le menu' : 'Ouvrir le menu');
    button.querySelector('.hamburger').textContent = open ? '✕' : '☰';
  });
  links.querySelectorAll('a').forEach(function(link){
    link.addEventListener('click', function(){
      links.classList.remove('is-open');
      button.setAttribute('aria-expanded','false');
      button.setAttribute('aria-label','Ouvrir le menu');
      button.querySelector('.hamburger').textContent = '☰';
    });
  });
})();
</script>

</body></html>
