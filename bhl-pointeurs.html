="none"><button type="button" class="table-sort" data-sort="starts" aria-label="Trier par Départs">Départs<span class="sort-indicator" aria-hidden="true">↕</span></button></th><th class="num" aria-sort="none"><button type="button" class="table-sort" data-sort="gp" aria-label="Trier par PJ">PJ<span class="sort-indicator" aria-hidden="true">↕</span></button></th><th class="num" aria-sort="descending"><button type="button" class="table-sort" data-sort="fpts" aria-label="Trier par FPTS">FPTS<span class="sort-indicator" aria-hidden="true">▼</span></button></th><th class="num" aria-sort="none"><button type="button" class="table-sort" data-sort="per-start" aria-label="Trier par FP/Départ">FP/Départ<span class="sort-indicator" aria-hidden="true">↕</span></button></th><th class="num" aria-sort="none"><button type="button" class="table-sort" data-sort="per-gp" aria-label="Trier par FP/GP">FP/GP<span class="sort-indicator" aria-hidden="true">↕</span></button></th></tr></thead><tbody id="results"></tbody></table></div></section></div><div id="panel-records" role="tabpanel" aria-labelledby="tab-records" hidden><section class="panel"><h2>Le livre des records BHL</h2><p class="muted">Top 10 des performances individuelles en alignement partant. Classements provisoires, calculés à partir des archives disponibles.</p><div class="filters"><label>Phase<select id="record-phase"><option value="regular">Saison régulière</option><option value="playoffs">Séries éliminatoires</option><option value="all">Total combiné</option></select></label><label>Saison<select id="record-season"><option value="">Toutes les saisons</option></select></label><label>Type de période<select id="record-duration"><option value="all">Tous</option><option value="regular" selected>Régulière (7 jours ou moins)</option><option value="extended">Prolongée (plus de 7 jours)</option></select></label><label>Position<select id="record-position"><option value="all">Toutes les positions</option><option value="forward">Attaquants</option><option value="defense">Défenseurs</option><option value="goalie">Gardiens</option></select></label></div></section><p id="record-filter-status" class="status" role="status"></p><div id="records-content" class="record-grid"></div></div>

'use strict';
const $=id=>document.getElementById(id),format=n=>Number(n||0).toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
let dataset=[];let playerIdentities={};const photoCache=new Map();const photoQueue=[];let photoActive=0;function queuePhoto(task){photoQueue.push(task);runPhotoQueue()}function runPhotoQueue(){while(photoActive<5&&photoQueue.length){const task=photoQueue.shift();photoActive++;Promise.resolve().then(task).catch(()=>{}).finally(()=>{photoActive--;runPhotoQueue()})}}const portraitNameKey=name=>String(name||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
let portraitDirectoryPromise;
function portraitDirectory(){
 return portraitDirectoryPromise||(portraitDirectoryPromise=fetch('data/nhl-player-directory.json',{cache:'force-cache'}).then(r=>r.ok?r.json():{players:{}}).catch(()=>({players:{}})));
}
const portraitIdCache=new Map();
async function resolvePortraitIdentity(id,name){
 const key=String(id),entry=playerIdentities[key];
 if(entry?.status==='confirmed'&&Number(entry.nhlId))return {nhlId:Number(entry.nhlId),headshot:'',team:entry.nhlTeam||''};
 const cacheKey=portraitNameKey(name);
 if(!portraitIdCache.has(cacheKey))portraitIdCache.set(cacheKey,(async()=>{
  const directory=await portraitDirectory();
  const matches=Object.entries(directory.players||{}).filter(([,p])=>portraitNameKey(p.name)===cacheKey);
  if(matches.length===1)return {nhlId:Number(matches[0][0]),headshot:'',team:matches[0][1].team||''};
  // Reuse the same verified identity resolver as the player profile.
  try{const resolved=await window.BHLPlayerStats?.officialIdentity?.(id,name);if(Number(resolved?.nhlId))return {nhlId:Number(resolved.nhlId),headshot:resolved.headshot||'',team:resolved.nhlTeam||''}}catch(e){}
  // Historic players may no longer appear in the current BHL/NHL roster directories.
  try{
   const response=await fetch('https://search.d3.nhle.com/api/v1/search/player?culture=en-us&limit=100&q='+encodeURIComponent(name));
   if(!response.ok)return null;
   const data=await response.json(),rows=Array.isArray(data)?data:(data?.data||[]);
   const exact=rows.filter(p=>portraitNameKey(p.name||p.fullName||p.playerName||[p.firstName,p.lastName].filter(Boolean).join(' '))===cacheKey&&Number(p.playerId||p.id)>0);
   const ids=[...new Set(exact.map(p=>Number(p.playerId||p.id)))];
   if(ids.length===1)return {nhlId:ids[0],headshot:'',team:''};
  }catch(e){}
  return null;
 })());
 return portraitIdCache.get(cacheKey);
}
async function loadPortrait(avatar,id,name){
 if(!avatar.isConnected||!name||name==='Identité non résolue')return;
 const identity=await resolvePortraitIdentity(id,name);
 const nhlId=Number(identity?.nhlId);
 if(!nhlId||!avatar.isConnected)return;
 const team=String(identity.team||'NHL').toUpperCase();
 const sources=[identity.headshot,
  'https://assets.nhle.com/mugs/nhl/20262027/'+team+'/'+nhlId+'.png',
  'https://assets.nhle.com/mugs/nhl/20252026/'+team+'/'+nhlId+'.png',
  'https://assets.nhle.com/mugs/nhl/20252026/NHL/'+nhlId+'.png',
  'https://assets.nhle.com/mugs/nhl/20242025/NHL/'+nhlId+'.png',
  'https://assets.nhle.com/mugs/nhl/20232024/NHL/'+nhlId+'.png'
 ].filter(Boolean);
 const img=document.createElement('img');img.alt='';img.decoding='async';
 let index=0;
 img.onload=()=>{if(img.isConnected)avatar.classList.add('has-photo')};
 img.onerror=()=>{index++;if(index<sources.length)img.src=sources[index];else{img.remove();avatar.classList.remove('has-photo')}};
 avatar.append(img);
 // The NHL player profile provides the preferred photo, including retired players.
 try{
  const response=await fetch('https://api-web.nhle.com/v1/player/'+nhlId+'/landing');
  if(response.ok){const profile=await response.json();if(profile.headshot&&/^https:\/\//.test(profile.headshot))sources.unshift(profile.headshot)}
 }catch(e){}
 if(img.isConnected)img.src=sources[0];
}
window.BHLRecordPortrait=(avatar,id,name)=>{avatar.dataset.playerId=String(id);avatar.dataset.playerName=name;if(portraitObserver)portraitObserver.observe(avatar);else queuePhoto(()=>loadPortrait(avatar,id,name))};const portraitObserver='IntersectionObserver' in window?new IntersectionObserver(entries=>{for(const entry of entries){if(entry.isIntersecting){portraitObserver.unobserve(entry.target);const el=entry.target;queuePhoto(()=>loadPortrait(el,el.dataset.playerId,el.dataset.playerName))}}},{rootMargin:'500px'}):null;
const organizations={"Cleveland Barons":"Boston Bruins","Boston Bruins":"Boston Bruins","Winnipeg Jets":"Colorado Avalanche","Colorado Avalanche":"Colorado Avalanche","Detroit Cougars":"Detroit Red Wings","Detroit Red Wings":"Detroit Red Wings","Vegas Golden Knights":"Florida Panthers","Florida Panthers":"Florida Panthers","Montréal Maroons":"Montréal Canadiens","Montreal Maroons":"Montréal Canadiens","Montréal Canadiens":"Montréal Canadiens","Montreal Canadiens":"Montréal Canadiens","Edmonton Oilers":"Ottawa Senators","Ottawa Senators":"Ottawa Senators"};
const normTeam=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const orgMap=new Map(Object.entries(organizations).map(([name,org])=>[normTeam(name),org]));
const orgFor=team=>orgMap.get(normTeam(team))||team;
const teamLogos={"anaheimmightyducks":"anaheim-mightyducks.png","atlantathrashers":"atlanta-thrashers.png","clevelandbarons":"cleveland-barons.png","bostonbruins":"boston-bruins.png","californiagoldenseals":"california-goldenseals.png","chicagoblackhawks":"chicago-blackhawks.png","winnipegjets":"winnipeg-jets.png","coloradoavalanche":"colorado-avalanche.png","detroitcougars":"detroit-cougars.png","detroitredwings":"detroit-redwings.png","floridapanthers":"florida-panthers.png","vegasgoldenknights":"vegas-golden-knights.png","hartfordwhalers":"hartford-whalers.png","minnesotanorthstars":"minnesota-northstars.png","montrealmaroons":"montreal-maroons.png","montrealcanadiens":"montreal-canadiens.png","nashvillepredators":"nashville-predators.png","newyorkrangers":"newyork-rangers.png","edmontonoilers":"edmonton-oilers.png","ottawasenators":"ottawa-senators.png","quebecnordiques":"quebec-nordiques.png","torontomapleleafs":"toronto-mapleleafs.png"};
const logoKey=s=>normTeam(s).replace(/ /g,'');
function fillOptions(id,items){const select=$(id);for(const name of items)select.append(new Option(name,name))}

function render(){
 const phase=$('phase').value,season=$('season').value,position=window.bhlPosition??'',team=$('team').value,organization=$('organization').value,search=$('search').value.trim().toLocaleLowerCase('fr');
 const grouped=new Map();
 for(const r of dataset){
  if((phase!=='all'&&r.phase!==phase)||(season&&r.season!==season)||(position==='skater'&&r.positionGroup==='goalie')||(position&&position!=='skater'&&r.positionGroup!==position)||(team&&r.team!==team)||(organization&&orgFor(r.team)!==organization))continue;
  const key=String(r.id)+'|'+String(r.kind||'');
  if(!grouped.has(key))grouped.set(key,{id:r.id,name:r.name||'Identité non résolue',teams:new Set(),fpts:0,starts:0,gp:0});
  const x=grouped.get(key);x.teams.add(r.team);x.fpts+=Number(r.fpts)||0;x.starts+=Number(r.starts)||0;x.gp+=Number(r.gp)||0;
 }
 const rows=[...grouped.values()].filter(r=>(r.name+' '+[...r.teams].join(' ')).toLocaleLowerCase('fr').includes(search)).sort((a,b)=>{
  const choice=window.bhlSort||'fpts-desc';const direction=choice.endsWith('-asc')?'asc':'desc';const field=choice.replace(/-(asc|desc)$/,'');
  if(field==='name')return a.name.localeCompare(b.name,'fr')*(direction==='desc'?-1:1);
  const value=(r)=>Number(field==='starts'?r.starts:field==='gp'?r.gp:r.fpts)||0;
  const metric=(r)=>choice.startsWith('per-start')?(r.starts?r.fpts/r.starts:0):choice.startsWith('per-gp')?(r.gp?r.fpts/r.gp:0):value(r);
  const diff=Number(metric(a))-Number(metric(b));
  return (direction==='asc'?diff:-diff)||a.name.localeCompare(b.name,'fr');
 });
 const body=$('results');body.replaceChildren();
 for(const [i,r] of rows.entries()){
  const tr=document.createElement('tr');
  const cells=[String(i+1),r.name,'',String(r.starts),String(r.gp),format(r.fpts),r.starts?format(r.fpts/r.starts):'—',r.gp?format(r.fpts/r.gp):'—'];
  cells.forEach((value,j)=>{const td=document.createElement('td');td.textContent=value;if(j===0)td.className='rank';if(j===1){td.className='player';const btn=document.createElement('button');btn.type='button';btn.className='player-profile';const avatar=document.createElement('span');avatar.className='player-avatar';avatar.setAttribute('aria-hidden','true');avatar.textContent=r.name.split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();avatar.dataset.playerId=String(r.id);avatar.dataset.playerName=r.name;if(portraitObserver)portraitObserver.observe(avatar);else queuePhoto(()=>loadPortrait(avatar,r.id,r.name));const label=document.createElement('span');label.className='player-name';label.textContent=r.name;btn.append(avatar,label);btn.dataset.bhlPlayerId=String(r.id);btn.dataset.bhlPlayerName=r.name;btn.title='Ouvrir la fiche de '+r.name;td.replaceChildren(btn)}if(j===2){td.className='team';const holder=document.createElement('div');holder.className='team-logos';for(const name of [...r.teams].sort((a,b)=>a.localeCompare(b,'fr'))){const file=teamLogos[logoKey(name)];if(file){const img=document.createElement('img');img.className='team-logo';img.src='logos/'+file;img.alt=name;img.title=name;img.loading='lazy';img.onerror=()=>{const fallback=document.createElement('span');fallback.className='team-fallback';fallback.textContent=name;img.replaceWith(fallback)};holder.append(img)}else{const fallback=document.createElement('span');fallback.className='team-fallback';fallback.textContent=name;holder.append(fallback)}}td.append(holder)}if(j>=3)td.className='num';tr.append(td)});
  body.append(tr);
 }
 if(!rows.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=8;td.className='empty';td.textContent='Aucun résultat disponible pour ces filtres.';tr.append(td);body.append(tr)}
 $('status').textContent=rows.length+' joueurs · données historiques provisoires';
}
async function init(){
 try{
  const response=await fetch('data/production/scorers.json',{cache:'no-store'});if(!response.ok)throw Error('Archives non encore publiées');
  const data=await response.json();if(!Array.isArray(data.rows))throw Error('Format des données invalide');
  dataset=data.rows;try{const ids=await fetch('data/player-identity-map.json',{cache:'force-cache'});if(ids.ok)playerIdentities=(await ids.json()).players||{}}catch(e){console.warn('Photos non disponibles',e)}const seasons=[...new Set(dataset.map(x=>x.season))].sort().reverse();
  for(const season of seasons)$('season').append(new Option(season,season));
  const now=new Date(),year=now.getFullYear()-(now.getMonth()<8?1:0);
  const currentSeason=year+'-'+String((year+1)%100).padStart(2,'0');
  $('season').value=seasons.includes(currentSeason)?currentSeason:(seasons[0]||'');
  const teams=[...new Set(dataset.map(x=>x.team).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));
  fillOptions('team',teams);fillOptions('organization',[...new Set(teams.map(orgFor))].sort((a,b)=>a.localeCompare(b,'fr')));
  render();
 }catch(e){$('status').textContent='Le calcul historique est en cours de préparation : '+e.message;$('results').innerHTML='<tr><td colspan="8" class="empty">Les résultats apparaîtront après une reconstitution validée et publiée.</td></tr>'}
}
['phase','season','team','organization','search'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));init();
document.querySelectorAll('.table-sort').forEach(btn=>btn.addEventListener('click',()=>{
 const field=btn.dataset.sort,old=window.bhlSort||'fpts-desc';
 window.bhlSort=old.startsWith(field+'-')?(old.endsWith('-desc')?field+'-asc':field+'-desc'):(field==='name'?field+'-asc':field+'-desc');
 const direction=window.bhlSort.endsWith('-asc')?'ascending':'descending';
 document.querySelectorAll('.table-sort').forEach(other=>{
  const active=other===btn;
  other.querySelector('.sort-indicator').textContent=active?(direction==='ascending'?'▲':'▼'):'↕';
  other.closest('th').setAttribute('aria-sort',active?direction:'none');
 });
 render();
}));
document.querySelectorAll('.position-tab').forEach(btn=>btn.addEventListener('click',()=>{
 window.bhlPosition=btn.dataset.position;
 document.querySelectorAll('.position-tab').forEach(tab=>{const active=tab===btn;tab.classList.toggle('active',active);tab.setAttribute('aria-pressed',String(active));});
 render();
}));
document.querySelectorAll('.record-tab').forEach(btn=>btn.addEventListener('click',()=>{const records=btn.id==='tab-records';document.getElementById('panel-records').hidden=!records;document.getElementById('panel-pointeurs').hidden=records;document.getElementById('tab-records').setAttribute('aria-selected',String(records));document.getElementById('tab-pointeurs').setAttribute('aria-selected',String(!records));}));
</script><script src="bhl-records.js?v=split-skaters-goalies-20261104" defer></script></body></html>
