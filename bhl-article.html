<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article | BHL</title><link rel="stylesheet" href="bhl-navigation.css?v=logo-shadow-20261114"><style>
*{box-sizing:border-box}body{margin:0;background:#eef0f2;color:#191919;font:16px/1.6 Arial,sans-serif}main{max-width:870px;margin:32px auto 60px;padding:0 18px}a{color:#b50000;text-decoration:none;font-weight:700}.article{background:#fff;border:1px solid #dfe2e6;border-top:5px solid #cc0000;border-radius:14px;padding:clamp(22px,5vw,48px);margin-top:24px}h1{font-size:clamp(29px,5vw,46px);line-height:1.13;letter-spacing:-1px;overflow-wrap:anywhere}.category{font-size:12px;color:#cc0000;text-transform:uppercase;font-weight:800;letter-spacing:.08em}.byline{font-size:13px;color:#626b75;border-bottom:1px solid #e1e4e8;padding-bottom:22px}.summary{font-size:20px;color:#4b5661;font-weight:700}.body{font-size:18px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}.end{border-top:1px solid #e1e4e8;padding-top:24px;margin-top:32px}[hidden]{display:none!important}
</style><link rel="stylesheet" href="bhl-news-format.css?v=inline1"><link rel="stylesheet" href="bhl-news-tags.css?v=1"></head><body><div id="bhl-global-nav"></div><main><a href="bhl-nouvelles.html">← Retour aux nouvelles</a><p id="status" role="status">Chargement de l’article…</p><article class="article" id="article" hidden><span class="category" id="category"></span><h1 id="title"></h1><p class="byline" id="byline"></p><figure id="cover" class="news-cover" hidden></figure><div class="body" id="body"></div><div class="end"><a href="bhl-nouvelles.html">Voir toutes les nouvelles →</a></div></article></main><script src="bhl-navigation.js?v=tournois-20261114" defer></script><script type="module">
import {articleTags} from './bhl-news-tag-ui.js?v=1';
import {db,date,paragraphs,publicFields} from './bhl-news-db.js?v=inline1';
import {renderCover} from './bhl-news-images.js?v=inline1';
import {articleByline} from './bhl-news-metadata.js?v=1';
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');
async function load(){if(!id||!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)){$('status').textContent='Article introuvable.';return;}
const {data:a,error}=await db.from('bhl_news').select(publicFields+',body,body_format').eq('id',id).eq('status','published').maybeSingle();if(error){$('status').textContent='Impossible de charger cet article. Réessaie dans un instant.';return;}if(!a){$('status').textContent='Cet article est introuvable ou n’est pas publié.';return;}document.title=a.title+' — BHL';$('title').textContent=a.title;$('category').textContent=a.category;$('byline').textContent=articleByline(a);renderCover(db,$('cover'),a,{eager:true});paragraphs($('body'),a.body,a.body_format);$('body').after(articleTags(a));$('status').hidden=true;$('article').hidden=false;}
load().catch(()=>{$('status').textContent='Impossible de charger cet article. Réessaie dans un instant.';});
</script></body></html>
